version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: debugdiary-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: debugdiary
      POSTGRES_PASSWORD: debugdiary
      POSTGRES_DB: debugdiary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debugdiary"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: debugdiary-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
