services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: debugdiary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: debugdiary
      POSTGRES_PASSWORD: debugdiary
      POSTGRES_DB: debugdiary
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
